<div class="p-0 m-0 cover">
  <div class="item-container container position-relative py-5">
    <img class="pattern" src="assets/flower.png" alt="pattern" />
    <div class="logo my-5">
      <img src="/assets/logo.png" alt="logo" />
    </div>
    <div class="log-form w-75">
      <h3 class="mb-3 fw-bold">Reset Your Password</h3>
      <form (ngSubmit)="forgetPassword(toEmailForm)" [formGroup]="toEmailForm">
        <div class="form-group">
          <label for="toEmail">Phone Number or Email Address</label>
          <input
            id="toEmail"
            placeholder="hello@gmail.com"
            type="email"
            formControlName="toEmail"
            class="form-control"
          />
          @if (toEmailForm.dirty&&toEmailCtrl.hasError('pattern')) {
          <div class="alert alert-danger">
            Invalid! email should end with gmail.com
          </div>

          } @if (mailError) {
          <div class="alert alert-danger">{{ mailError }}</div>
          }
        </div>
        <div class="btn-status my-5 w-100 d-flex justify-content-center">
          <button
            (click)="openLogin()"
            class="btn back btn-outline-success px-5 py-2 mx-3"
          >
            Back
          </button>
          <button
            type="submit"
            [disabled]="toEmailForm.invalid"
            class="btn next btn-success px-5 py-2 mx-3"
          >
            Next
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
