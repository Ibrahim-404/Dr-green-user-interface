<div class="p-0 m-0 cover ">

  <div class="item-container container position-relative py-5">
    <img class="pattern" src="assets/flower.png" alt="pattern">
    <div class="logo my-5">
      <img src="/assets/logo.png" alt="logo">
    </div>
    <form (ngSubmit)="confirmNewPassword()" [formGroup]="newPasswordForm">
      <div class="log-form  w-75">
        <h3 class="mb-3 fw-bold">Add new password </h3>
      <div class="form-group">
        <label for="newPassword">New Password</label>
        <input id="newPassword" formControlName="password" placeholder="*********" type="text" class="form-control">
      </div>
      <div class="form-group">
        <label for="rePassword">Confirm Password</label>
        <input id="rePassword" formControlName="rePassword" placeholder="*********" type="text" class="form-control">
      </div>
      <div class="btn-status my-5 w-100 d-flex justify-content-center">
        <button (click)="openVerification()" class="btn back btn-outline-success px-5 py-2 mx-3">Back</button>
        <button [disabled]="newPasswordForm.invalid" type="submit" class="btn next btn-success px-5 py-2 mx-3">Confirm</button>
      </div>
    </div>
  </form>
</div>
