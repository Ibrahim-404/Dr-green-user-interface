<div class="my-2 bg-white mx-3">
  <div class="title">
    <img class="w-100 m-2 rounded-3" src="assets/people.png" alt="" />

    <h4 *ngIf="mealTypeId==1">{{'Breakfast'|translate}}</h4>
    <h4 *ngIf="mealTypeId==2">{{'Lunch'|translate}}</h4>
    <h4 *ngIf="mealTypeId==3">{{'Dinner'|translate}}</h4>
  </div>
  @for (chosen of currChosenProducts; track $index) {


            <div
            class="meal px-1 py-2 d-flex justify-content-between align-items-center w-100"
          >
          <div class="meal-left d-flex align-items-center">
            <img src="assets/flower.png" alt="" />
            <h5 class="m-0">name</h5>
          </div>
          <div class="meal-right">
            <span *ngIf="chosen.mealTiming==20" class="rounded-5 bg-danger p-2">{{'After'|translate}}</span>
            <span *ngIf="chosen.mealTiming==10" class="rounded-5 bg-warning p-2">{{'Before'|translate}}</span>
          </div>

        </div>

        }


  <div *ngIf="_MyplanService.canUpdate"  class="add-food w-100 rounded p-2 pointer" (click)="openAddDiatrySupplements(mealTypeId)">
    <i
      class="fa-solid text-white fa-plus bg-success rounded-5 p-2 mx-2"
    ></i>
    <span>{{'Add Dietary supplements'|translate}}</span>
  </div>
</div>
