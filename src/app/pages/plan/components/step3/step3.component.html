<div class="cover">
  <div class="plan p-5 w-100">
    <div class="steps w-50 my-3">
      <mat-progress-bar mode="determinate" value="30"></mat-progress-bar>
    </div>
    <h3 class="pry-color fw-bold">{{'Step 3/7'|translate}}</h3>

    <div class="question mb-4">
      <h1>{{'What is your Weight?'|translate}}</h1>
    </div>
    <div class="answer row justify-content-evenly">
      <app-ruler [length]="50"></app-ruler>

      <div
        class="text-content d-flex justify-content-around align-items-center"
      >
        <input
          [(ngModel)]="weight"
          id="weight"
          type="text"
          appOnlyNumbers
          placeholder="21"
          class="form-control mx-3"
        />
        <label class="col-md-3" for="weight">{{'Kg'|translate}}</label>
      </div>
    </div>
    <div class="status d-flex justify-content-around w-100">
      <button
        (click)="openStep2()"
        class="btn btn-success w-75 my-5 rounded-3 me-2 back-btn fw-bold"
      >
        {{'Back'|translate}}
      </button>
      <button
        [disabled]="!weight"
        (click)="openStep4()"
        class="btn btn-success w-75 my-5 rounded-3 fw-bold pry-bg border-0"
      >
        {{'Next'|translate}}
      </button>
    </div>
  </div>
</div>
