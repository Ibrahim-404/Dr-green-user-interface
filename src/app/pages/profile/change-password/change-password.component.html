<div class="container p-3">
  <h3 class="mb-4">{{'Change Password'|translate}}</h3>
  <form [formGroup]="formData" (ngSubmit)="changePass()">
    <div class="form-group my-2">
      <label  class="mb-2" for="current">{{'Current Password'|translate}} </label>
      <input required formControlName="oldPassword" type="password" class="form-control">
    </div>
    <div class="form-group my-4">
      <label class="mb-2" for="current">{{'New Password'|translate}} </label>
      <input required formControlName="newPassword" type="password" class="form-control">
    </div>
    <div class="mb-2" class="form-group my-4">
      <label for="current">{{'Confirm Password'|translate}} </label>
      <input required formControlName="confirmNewPassword" type="password" class="form-control">
    </div>
    <div *ngIf="err" class="alert alert-danger">
      {{err}}
    </div>
    <div *ngIf="formData.hasError('notMatching')" class="alert alert-danger">
      {{'The new password and confirmation password do not match.'|translate}}
    </div>
    <div class="btn-container d-flex justify-content-center my-4">

      <button [disabled]="formData.invalid" class="btn btn-success px-5 py-2">{{'Confirm'|translate}}</button>
    </div>
  </form>
</div>
