<div
  class="container d-flex flex-column align-items-center justify-content-center py-5"
>
  <h4 class="text-center pry-color">Add your meal manually</h4>
  <form (ngSubmit)="onSave()" [formGroup]="customFoodForm" #mealForm="ngForm">
    <div class="form-group">
      <label for="mealName">Meal's name</label>
      <input
        type="text"
        required
        formControlName="name"
        name="mealName"
        class="form-control"
        id="mealName"
      />
    </div>
    <div class="form-group d-flex justify-content-between my-2">
      <div class="form-group pe-2 my-2">
        <label for="grams">Grams</label>
        <input
          type="text"
          appOnlyNumbers
          required
          formControlName="quantityInGrams"
          name="grams"
          class="form-control"
          id="grams"
        />
      </div>
      <div class="form-group my-2">
        <label for="calories">Calories</label>
        <input
          type="text"
          appOnlyNumbers
          required
          formControlName="calories"
          name="calories"
          class="form-control"
          id="calories"
        />
      </div>
    </div>

    <button
      type="submit"
      [disabled]="!mealForm.form.valid"
      class="btn pry-bg text-white w-100"
    >
      Save
    </button>
  </form>
</div>
