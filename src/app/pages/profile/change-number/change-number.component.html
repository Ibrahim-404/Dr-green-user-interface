<div class="container p-3">
  <h3 class="m-2">{{'Change Phone Number'|translate}} </h3>
  <p class="pra-col">{{'Please enter Your phone number'|translate}}</p>
  <div class="form-group my-2">
    <label class="mb-2" for="current">{{'Phone number'|translate}}</label>
    <input type="text" class="form-control">
  </div>

  <div class="btn-container d-flex justify-content-center my-4">

    <button (click)="openConfirmNumber()" class="btn btn-success px-5 py-2">{{'Next'|translate}}</button>
  </div>
</div>
