<h4> <span>{{addressData.id ? 'Edit' : 'Add'}}</span> Address</h4>

<div class="w-100 d-flex flex-column align-items-end justify-content-end p-3">
  <div class="w-100 d-flex justify-content-between">
    <div class="left">
      <!-- <google-map [center]="center" [zoom]="zoom" height="500px" width="100%">
        <map-marker
          *ngFor="let marker of markers"
          #mapMarker="mapMarker"

    </div>
    <div class="right">
      <h6 class="mb-3">Location Info </h6>
      <form (ngSubmit)="addAddress()" [formGroup]="addAddressForm">
        <div class="form-group my-3">
          <label for="detail">Additional address details</label>
          <input type="text"  class="form-control" formControlName="detail" id="detail" />
        </div>
        <div class="form-group my-3">
          <label for="detail">Phone Number </label>
          <input type="text" formControlName="phoneNumber" class="form-control" id="phone" />
        </div>

        <h3>Personal Info </h3>
        <div class="form-group my-3 d-flex">
          <div class="form-group my-3 mx-2">
            <label for="detail">First Name</label>
            <input type="text" formControlName="fName" class="form-control" id="fName" />
          </div>
          <div class="form-group my-3">
            <label for="detail">Last Name</label>
            <input type="text" formControlName="lName" class="form-control" id="lName" />
          </div>
        </div>
        <div class="d-flex w-100 justify-content-between align-items-center my-2">
          <h6>LabelTitle</h6>
          <div class="d-flex ">
            <button (click)="locationCtrl=10" class="btn btn-success me-2">Home</button>
            <button (click)="locationCtrl=20"  class="btn btn-light">Work</button>
          </div>

        </div>
        <div class="d-flex justify-content-between w-100 my-2">
          <h5>Set as default address</h5>
          <label class="checkbox-inline">
            <input type="checkbox" formControlName="isDefault" data-toggle="toggle"> First
          </label>
        </div>
        <button type="submit" class="btn btn-success">Confirm Location</button>
      </form>
    </div>
  </div>
</div>
